name: Health Check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Bell API and school directory
        id: check-bell-api
        run: |
          curl --fail --show-error --silent https://bellapi.vercel.app/api/version > /dev/null
          # The production directory currently contains 119 published schools.
          # Keep a floor plus the sentinel IDs so a single missing school still
          # fails the check without alerting on the valid current directory.
          curl --fail --show-error --silent https://bellapi.vercel.app/api/sources \
            | jq --exit-status 'type == "array" and length >= 119 and
                any(.[]; .id == "188535") and
                any(.[]; .id == "064188") and
                any(.[]; .id == "gbms")' > /dev/null
          curl --fail --show-error --silent https://bellapi.vercel.app/api/data/188535 \
            | jq --exit-status '.meta.name and .calendar and .schedules' > /dev/null
        continue-on-error: true

      - name: Check live editor schedule proxy
        id: check-edit
        run: |
          curl --fail --show-error --silent https://iosbell-api.ahmadmahrous853.workers.dev/config/schedule-source/188535 \
            | jq --exit-status '.meta.name and .calendar and .schedules' > /dev/null
          curl --fail --show-error --silent https://iosbell-api.ahmadmahrous853.workers.dev/config/schedule-source/gbms \
            | jq --exit-status '.meta.name and .calendar and .schedules' > /dev/null
        continue-on-error: true

      - name: Send notification if Bell API is unhealthy
        if: steps.check-bell-api.outcome == 'failure'
        run: |
          curl -X POST \
            -H "Title: Bell API is unhealthy" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "The school directory or live schedule proxy failed its health check." \
            https://ntfy.sh/nicolaschan_alerts

      - name: Send notification if editor school API is unhealthy
        if: steps.check-edit.outcome == 'failure'
        run: |
          curl -X POST \
            -H "Title: Bell editor schedule proxy is unhealthy" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "The public editor schedule proxy failed its health check." \
            https://ntfy.sh/nicolaschan_alerts

      - name: Fail workflow if any check failed
        if: steps.check-bell-api.outcome == 'failure' || steps.check-edit.outcome == 'failure'
        run: exit 1
