<!DOCTYPE html>
<html lang="en" data-bell-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Countdown to the next time the bell rings at school.">
    <meta name="keywords" content="countdown,bell,schedule,lahs,school">
    <meta name="theme-color" content="#f8f4f0">
    <meta name="apple-mobile-web-app-title" content="Bell">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="img/logo/logo-square/logo-square-1024.png">
    <title id="title">Bell Countdown</title>
    <link rel="shortcut icon" type="image/png" href="/favicons/empty.png" id="favicon">
    <link rel="manifest" href="/manifest.json">
    <script>
      // Pick the redesign or the original UI (see src/Design.js) before anything renders
      (function () {
        var design = 'new'
        try { design = window.localStorage.getItem('bell_design') || 'new' } catch (e) {}
        document.documentElement.setAttribute('data-design', design)
        var sheets = design === 'classic'
          ? ['/css/mithril-selector.min.css', '/css/style-mithril.css']
          : ['/css/redesign.css']
        sheets.forEach(function (href) {
          document.write('<link rel="stylesheet" href="' + href + '">')
        })
        if (design !== 'classic') {
          document.write('<link rel="preload" href="/fonts/inter/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>')
          document.write('<link rel="preload" href="/fonts/inter/inter-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>')
        }
      })()
    </script>
    <script type="text/javascript" src="/timesync/timesync.js"></script>
  </head>
  <body>
    <script type="text/javascript" src="/bin/client-mithril.js"></script>
  </body>
</html>
